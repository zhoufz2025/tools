server.port=18080

# ========== 本地 MySQL 初始化 ==========
# SQL 基线根目录（指向 app/sql）
local.db.sql-root=/Users/zhoufz/hundsun/lcpt60/git/Sources/app/sql
# mysql 客户端（Homebrew mysql@8.4）
local.db.mysql-bin=/opt/homebrew/opt/mysql@8.4/bin/mysql
local.db.host=127.0.0.1
local.db.port=3306
local.db.username=root
# 请填写本机 root 密码；无密码留空；也可用环境变量 LOCAL_DB_PASSWORD
local.db.password=${LOCAL_DB_PASSWORD:Admin@12345}
# 全量初始化前是否 DROP 并重建库
local.db.recreate-on-init=true
# 是否额外创建 dxfundsingledb（基金批量单库）
local.db.include-dxfund-single-db=false
# 应用启动时是否自动全量初始化（耗时很长，默认关闭）
local.db.auto-init-on-start=false
# 默认刷新的数据库种类（逗号分隔）：pub,dxfund,dxasset,dxtrust
# pub 规则：sql-pub + 各子系统 pub 目录脚本均导入 lcptpub；trans 目录导入各自 trans 库
# DDL 规则：每个模块内先执行 *.table.sql，再执行 *.index.sql
local.db.categories=pub,dxfund,dxasset,dxtrust
